name: 构建 Windows 安装包

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "要发布的版本号，例如 v0.1.0；留空只构建不发布"
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 打包
        run: npx tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: moshu-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 整理免安装版
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/moshu.exe "portable/墨枢.exe"
          Set-Content -Encoding utf8 portable/说明.txt "双击「墨枢.exe」即可运行，不用安装。`r`n需要系统带有 Microsoft Edge WebView2 运行库（Windows 10/11 一般自带）；打不开时到 https://go.microsoft.com/fwlink/p/?LinkId=2124703 安装。`r`n作品数据存在 %APPDATA%\app.moshu.writer\ 下，换电脑时复制这个文件夹即可。"

      - name: 上传免安装版
        uses: actions/upload-artifact@v4
        with:
          name: moshu-windows-portable
          path: portable/
          if-no-files-found: error

      - name: 准备发布文件
        if: env.TAG != ''
        shell: pwsh
        run: |
          $v = "${{ env.TAG }}".TrimStart("v")
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "release/moshu_${v}_x64-setup.exe"
          Compress-Archive -Path portable/* -DestinationPath "release/moshu_${v}_x64-portable.zip"

      - name: 发布到 Releases
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 墨枢 ${{ env.TAG }}
          files: release/*
          body: |
            **安装版**：下载 `moshu_*_x64-setup.exe`，双击安装。
            **免安装版**：下载 `moshu_*_x64-portable.zip`，解压后双击「墨枢.exe」直接运行。

            两个版本都需要 Windows 10/11（自带 WebView2 运行库）。作品数据存在 `%APPDATA%\app.moshu.writer\`，两个版本共用。
            第一次打开后到「设置」里填 DeepSeek API 密钥。

            本版内容：写作、大纲（人物 / 大纲 / 事件 / 篇幅规划及互相同步）、风格（含书库统计预设和拆书）、记忆与每日结账、右下角 AI 助手。
