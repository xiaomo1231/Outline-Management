name: 构建 Windows 安装包

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "要发布的版本号，例如 v0.2.0；留空只构建不发布"
        required: false
        default: ""
      notes:
        description: "本版更新说明（可选，会写在发布页最上面；下面还会自动附上合并的 PR 列表）"
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: npm ci

      # 发版时把标签里的版本号写进 package.json，桌面程序和界面上的版本号都从这里取
      - name: 写入版本号
        if: env.TAG != ''
        shell: pwsh
        run: |
          $v = "${{ env.TAG }}".TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "版本号要写成 v1.2.3 的格式，现在是 ${{ env.TAG }}" }
          npm version $v --no-git-tag-version --allow-same-version

      - name: 单元测试
        run: npm test

      - name: 打包
        run: npx tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: moshu-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 整理免安装版
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/moshu.exe "portable/墨枢.exe"
          Set-Content -Encoding utf8 portable/说明.txt "双击「墨枢.exe」即可运行，不用安装。`r`n需要系统带有 Microsoft Edge WebView2 运行库（Windows 10/11 一般自带）；打不开时到 https://go.microsoft.com/fwlink/p/?LinkId=2124703 安装。`r`n作品数据存在 %APPDATA%\app.moshu.writer\ 下，换电脑时复制这个文件夹即可。`r`n更新：关掉墨枢，用新版的「墨枢.exe」替换这个文件，作品数据不受影响。"

      - name: 上传免安装版
        uses: actions/upload-artifact@v4
        with:
          name: moshu-windows-portable
          path: portable/
          if-no-files-found: error

      - name: 准备发布文件
        if: env.TAG != ''
        shell: pwsh
        run: |
          $v = "${{ env.TAG }}".TrimStart("v")
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "release/moshu_${v}_x64-setup.exe"
          Compress-Archive -Path portable/* -DestinationPath "release/moshu_${v}_x64-portable.zip"
          # 免安装版自动更新时直接下载这个 exe
          Copy-Item src-tauri/target/release/moshu.exe "release/moshu_${v}_x64-portable.exe"

      - name: 发布到 Releases
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 墨枢 ${{ env.TAG }}
          files: release/*
          generate_release_notes: true
          body: |
            ${{ inputs.notes }}

            ## 下载

            - **安装版**：`moshu_*_x64-setup.exe`，双击安装。
            - **免安装版**：`moshu_*_x64-portable.zip`，解压后双击「墨枢.exe」运行。（`moshu_*_x64-portable.exe` 是给自动更新用的，不用手动下载）

            需要 Windows 10/11（自带 WebView2 运行库）。第一次打开后到「设置」里填 DeepSeek API 密钥。

            ## 从旧版本更新

            v0.2.2 起：到「设置 → 版本」点「检查更新」，墨枢会自己下载新版，下好后点「安装并重启」即可。更早的版本按下面手动更新：

            1. 关掉正在运行的墨枢。（可以先到「设置 → 备份与恢复」点「立即备份」）
            2. 安装版：直接运行新的 setup.exe，覆盖安装到原来的位置。免安装版：用新的「墨枢.exe」替换旧的。
            3. 打开墨枢，到「设置 → 版本」确认版本号。

            作品数据存在 `%APPDATA%\app.moshu.writer\`，两个版本共用，更新不会动它；新版第一次打开时会自动升级数据库。
